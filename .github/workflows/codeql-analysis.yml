name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 23 * * 3'

jobs:
  analyze:
    name: Analyze
    # A hosted runner label that no longer exists leaves the job queued forever.
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['c-cpp']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libboost-dev libboost-system-dev libssl-dev zlib1g-dev

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    # CMake 4 refuses cmake_minimum_required below 3.5, which the submodules still
    # use. The policy minimum keeps the build working once the runner moves to it.
    - name: Build
      run: |
        cmake -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build build --parallel "$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
