[main]
#storage=/var/spool/zbot
#log_file=/var/log/zbot.log
#pid_file=/var/run/zbot/zbotd.pid

# Wait in seconds
#wait=10

#accuracy=0.4
#spread=0.1
#max_messages=50
#min_approx=5
#bot_enable=1
#dont_approximate_multibyte=0

# Send every message as it arrives instead of collecting them for wait seconds
#immediate_send=0

# Before sending a group, look at the messages the bot has already sent to the
# same chat, merge the similar ones into the group and delete them from the chat.
# Set either parameter to 0 to switch this off.
#history_max_age_minutes=60
#history_check_count=20

[zabbix]
#zabbix_url=https://company.com/zabbix/
#user=zbot
#password=zbotpassword
[telegram]
#admin_users=username
#notify_chats=-10012345 912345
token=***token***
#webhook_enable=0
#webhook_path=/zbot/webhook?token=randomhash
#webhook_public_host=zbot.org
#webhook_bind_port=8080
